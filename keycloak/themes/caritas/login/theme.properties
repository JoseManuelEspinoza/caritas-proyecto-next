# Tema de login institucional de Cáritas Lima.
# Hereda de keycloak.v2 (PatternFly 5) y solo re-marca colores, logo y textos,
# para que la pantalla de credenciales se vea como parte del sistema GRD.
parent=keycloak.v2
import=common/keycloak

# css/styles.css se resuelve del tema padre; css/caritas.css lo sobreescribe.
styles=css/styles.css css/caritas.css

locales=es,en
