# ─── PRODUCCIÓN ───────────────────────────────────────────────────────────────
# Levantar:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Requisitos: DNS de app.tudominio y auth.tudominio apuntando al servidor,
# puertos 80/443 abiertos. La BD de la app es externa (AWS RDS) vía DATABASE_URL.
services:
  # Reverse proxy con HTTPS automático (Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - keycloak

  # Aplicación Next.js (imagen standalone)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    # Sin puertos al host: Caddy enruta app.tudominio → web:3000

  # Keycloak (Identity Provider)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # URL pública del IdP (debe coincidir con AUTH_KEYCLOAK_ISSUER sin /realms/...)
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-caritas.json:/opt/keycloak/data/import/realm-caritas.json:ro
    expose:
      - "8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  # Base de datos de Keycloak (separada de la app)
  keycloak-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  keycloak_db_data:
