# Override local: evita el choque con el PostgreSQL 18 instalado en el host
# (que ya ocupa el puerto 5432). El contenedor sigue usando 5432 internamente;
# solo se cambia el puerto publicado al host a 5433.
services:
  db:
    ports:
      - "5433:5432"
  web:
    environment:
      # Keycloak Admin API — debe coincidir con el servicio keycloak del compose principal
      - KEYCLOAK_ADMIN_URL=http://keycloak:8085
      - KEYCLOAK_REALM=caritas
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASS=admin
    command: sh -c "npm install && npm install lightningcss-linux-arm64-gnu @tailwindcss/oxide-linux-arm64-gnu --no-save 2>/dev/null || true && ln -sf /app/node_modules/lightningcss-linux-arm64-gnu/lightningcss.linux-arm64-gnu.node /app/node_modules/lightningcss/lightningcss.linux-arm64-gnu.node 2>/dev/null || true && ln -sf /app/node_modules/@tailwindcss/oxide-linux-arm64-gnu/tailwindcss-oxide.linux-arm64-gnu.node /app/node_modules/@tailwindcss/oxide/tailwindcss-oxide.linux-arm64-gnu.node 2>/dev/null || true && npx prisma generate && npm run dev"
