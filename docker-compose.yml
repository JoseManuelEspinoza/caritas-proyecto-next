services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:CaritasDB_2026_Test@caritas-grd-db.c2sjosirydcu.us-east-1.rds.amazonaws.com:5432/caritas_db?schema=public&uselibpqcompat=true&sslmode=require
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-minimo-32-caracteres-cambiar-en-prod}
      - APP_URL=http://localhost:3000
      - NODE_ENV=development
      # Limit Node.js heap to 4 GB — prevents unbounded growth that caused ~60 GB RAM usage.
      - NODE_OPTIONS=--max-old-space-size=4096
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # 300 ms was polling 1 GB of node_modules thousands of times/sec; 3 s is sufficient.
      - CHOKIDAR_INTERVAL=3000
      # ─── Auth.js v5 + Keycloak (OIDC) — Keycloak REMOTO en Render ───────────
      # Keycloak ya NO corre en local; la app consume el servicio desplegado.
      - AUTH_SECRET=dev-auth-secret-cambiar-en-produccion-min-32-chars
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://localhost:3000
      - AUTH_KEYCLOAK_ID=caritas-app
      - AUTH_KEYCLOAK_SECRET=caritas-app-secret-dev
      - AUTH_KEYCLOAK_ISSUER=https://caritas-proyecto-next.onrender.com/realms/caritas
      # NO definir AUTH_KEYCLOAK_INTERNAL_URL con Keycloak remoto: token/userinfo
      # también van por la URL pública. Si se define, el intercambio del token falla.
      # ─── Keycloak Admin API (para crear cuentas de brigadistas, etc.) ────────
      - KEYCLOAK_ADMIN_URL=https://caritas-proyecto-next.onrender.com
      - KEYCLOAK_REALM=caritas
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASS=PonUnaClaveFuerte123!
      # SMTP — se lee desde el archivo .env del proyecto
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@caritas-lima.pe}
      # ─── Amazon S3 (evidencias) — se leen desde .env ───────────────────────
      - AWS_REGION=${AWS_REGION:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL:-}
      # ─── Consulta de DNI (RENIEC) — se leen desde .env ─────────────────────
      - RENIEC_API_URL=${RENIEC_API_URL:-}
      - RENIEC_AUTH_MODE=${RENIEC_AUTH_MODE:-}
      - RENIEC_API_TOKEN=${RENIEC_API_TOKEN:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm install lightningcss-linux-arm64-gnu @tailwindcss/oxide-linux-arm64-gnu --no-save 2>/dev/null || true && ln -sf /app/node_modules/lightningcss-linux-arm64-gnu/lightningcss.linux-arm64-gnu.node /app/node_modules/lightningcss/lightningcss.linux-arm64-gnu.node 2>/dev/null || true && ln -sf /app/node_modules/@tailwindcss/oxide-linux-arm64-gnu/tailwindcss-oxide.linux-arm64-gnu.node /app/node_modules/@tailwindcss/oxide/tailwindcss-oxide.linux-arm64-gnu.node 2>/dev/null || true && npx prisma generate && npm run dev"

  # ─── Base de datos de la APLICACIÓN ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: caritas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════════════════════════════════════
  # KEYCLOAK LOCAL — DESACTIVADO. Ahora se usa el Keycloak desplegado en Render:
  #   https://caritas-proyecto-next.onrender.com
  # Para volver a correr Keycloak en local, descomenta estos dos servicios y la
  # entrada `keycloak_db_data` en `volumes:`, y restaura las variables del
  # servicio `web` a localhost:8085 / keycloak:8085 (ver git history).
  # ═══════════════════════════════════════════════════════════════════════════
