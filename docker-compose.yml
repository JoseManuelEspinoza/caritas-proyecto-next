  # keycloak:
  #   image: quay.io/keycloak/keycloak:26.0
  #   command: start-dev --import-realm
  #   environment:
  #     KC_DB: postgres
  #     KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
  #     KC_DB_USERNAME: keycloak
  #     KC_DB_PASSWORD: keycloak123
  #     KC_BOOTSTRAP_ADMIN_USERNAME: admin
  #     KC_BOOTSTRAP_ADMIN_PASSWORD: admin
  #     KC_HTTP_ENABLED: "true"
  #     KC_HTTP_PORT: "8085"
  #     KC_HOSTNAME: http://localhost:8085
  #     KC_HOSTNAME_STRICT: "false"
  #     KC_HEALTH_ENABLED: "true"
  #   ports:
  #     - "8085:8085"
  #   volumes:
  #     - ./keycloak/realm-caritas.json:/opt/keycloak/data/import/realm-caritas.json:ro
  #     - ./keycloak/themes:/opt/keycloak/themes:ro
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   depends_on:
  #     keycloak-db:
  #       condition: service_healthy

  # Servidor de email para desarrollo — Bandeja web: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  # keycloak_db_data:   # desactivado: Keycloak corre en Render, no en local
  node_modules:
