services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:CaritasDB_2026_Test@caritas-grd-db.c2sjosirydcu.us-east-1.rds.amazonaws.com:5432/caritas_db?schema=public&uselibpqcompat=true&sslmode=require
      - SESSION_SECRET=dev-secret-minimo-32-caracteres-cambiar-en-prod
      - APP_URL=http://localhost:3000
      - NODE_ENV=development
      # Limit Node.js heap to 4 GB — prevents unbounded growth that caused ~60 GB RAM usage.
      - NODE_OPTIONS=--max-old-space-size=4096
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # 300 ms was polling 1 GB of node_modules thousands of times/sec; 3 s is sufficient.
      - CHOKIDAR_INTERVAL=3000
      # ─── Auth.js v5 + Keycloak (OIDC) ──────────────────────────────────────
      # AUTH_KEYCLOAK_ISSUER → URL interna Docker: el contenedor la usa para
      #   OIDC discovery, token exchange y JWKS (todos server-side via keycloak:8080).
      # AUTH_KEYCLOAK_AUTHORIZATION → URL pública: solo el navegador la usa para
      #   el redirect de login. Se sobreescribe en auth.config.ts.
      - AUTH_SECRET=dev-auth-secret-cambiar-en-produccion-min-32-chars
      - AUTH_TRUST_HOST=true
      - AUTH_URL=http://localhost:3000
      - AUTH_KEYCLOAK_ID=caritas-app
      - AUTH_KEYCLOAK_SECRET=caritas-app-secret-dev
      # Un único issuer alcanzable IGUAL desde el navegador (Windows resuelve
      # host.docker.internal → 127.0.0.1) y desde el contenedor (extra_hosts →
      # host-gateway → puerto 8085 del host). Así el `iss` del token coincide con
      # el issuer configurado y el discovery/JWKS/token funcionan server-side.
      - AUTH_KEYCLOAK_ISSUER=http://host.docker.internal:8090/realms/caritas
      - KEYCLOAK_ADMIN_URL=http://host.docker.internal:8090
      - KEYCLOAK_REALM=caritas
      - KEYCLOAK_ADMIN_CLIENT_ID=caritas-app
      - KEYCLOAK_ADMIN_CLIENT_SECRET=caritas-app-secret-dev
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASS=admin
      # SMTP — se lee desde el archivo .env del proyecto
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@caritas-lima.pe}
      # ─── Amazon S3 (evidencias) — se leen desde .env ───────────────────────
      - AWS_REGION=${AWS_REGION:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL:-}
      # ─── Consulta de DNI (RENIEC) — se leen desde .env ─────────────────────
      - RENIEC_API_URL=${RENIEC_API_URL:-}
      - RENIEC_AUTH_MODE=${RENIEC_AUTH_MODE:-}
      - RENIEC_API_TOKEN=${RENIEC_API_TOKEN:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"

  # ─── Base de datos de la APLICACIÓN ──────────────────────────────────────────
  db:
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CaritasDB_2026_Test
      POSTGRES_DB: caritas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Base de datos de KEYCLOAK (separada de la app, NO H2) ───────────────────
  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── KEYCLOAK (Identity Provider / OIDC) ─────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      # Persistencia en PostgreSQL (buena práctica de producción; nada de H2)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      # Admin inicial (consola en /admin)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # HTTP local (sin TLS en dev) + health
      KC_HTTP_ENABLED: "true"
      # URL pública del IdP: debe coincidir con el issuer que usa la app.
      KC_HOSTNAME: http://host.docker.internal:8090
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8090:8080"
    volumes:
      # El realm se importa al primer arranque
      - ./keycloak/realm-caritas.json:/opt/keycloak/data/import/realm-caritas.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak-db:
        condition: service_healthy

  # Servidor de email para desarrollo — Bandeja web: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  keycloak_db_data:
  node_modules:
